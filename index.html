<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Matt Smith Team - Real Estate Hub</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Typography matched to Follow Up Boss (John, 2026-09-30).
       FUB sets proxima-nova, which is licensed through Adobe Fonts and cannot be
       self-hosted or pulled from Google Fonts without that licence. Figtree is the closest
       free face: same geometric-humanist build, same open apertures, and it holds up at
       13-14px where Montserrat gets too wide and Inter reads colder.
       WITH an Adobe Fonts subscription this becomes exact - swap this link for the Typekit
       kit and change --font-sans in app.css to proxima-nova. Nothing else has to move. -->
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // Apply the accent theme before first paint: user override, else cached team
    // default, else Matt Smith Gold. App.jsx refreshes the team default after login.
    try {
      var a = localStorage.getItem('hub_accent') || localStorage.getItem('hub_accent_team') || 'gold'
      document.documentElement.setAttribute('data-accent', a)
    } catch (e) { document.documentElement.setAttribute('data-accent', 'gold') }
  </script>
  <!-- Twilio Voice SDK (browser softphone). Loads a global window.Twilio.Device.
       `defer` keeps it off the critical path but still runs before the app module.

       Served from the Hub's OWN origin. It used to come straight from jsdelivr, which
       made a third-party CDN a single point of failure for the phone: if a VPN exit, a
       corporate filter or a privacy extension would not fetch it, window.Twilio.Device
       never appeared and the only symptom was "Phone SDK failed to load". Same origin as
       the app means anyone who can open the Hub at all can load the phone.

       jsdelivr stays as a fallback for the one case the local copy cannot cover: a
       deploy that shipped without the vendor file. -->
  <script defer src="/vendor/twilio-voice-2.18.3.min.js"
          onerror="(function(el){el.remove();var s=document.createElement('script');s.defer=true;s.src='https://cdn.jsdelivr.net/npm/@twilio/voice-sdk@2.18.3/dist/twilio.min.js';document.head.appendChild(s)})(this)"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
